name: Licence

# core/ is MIT OR GPL-2.0-only and includes only the C++ standard library,
# other core/ files and swarm-core's dual-licensed core/; everything else is
# GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@9a1ce0ffeda6916186f97b0c5a7678bcbc7578ad # main@2026-11-24
    with:
      dual-roots: core/
      core-roots: core/

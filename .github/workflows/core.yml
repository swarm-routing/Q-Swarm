name: Core

# Q-Swarm's simulator-free core/ on its own (plain CMake + ctest, no simulator
# tree), with the org's quality gates for C++, as ARA's core.yml: strict
# warnings as errors (in core/CMakeLists.txt), the tests under ASan + UBSan,
# clang-tidy and clang-format with the org configs, and the installed CMake
# package q-swarm-core with a find_package consumer (the vcpkg port's shape).
# swarm-core's primitives come from its vcpkg port (swarm-routing/.github#489):
# vcpkg.json pins the version swarm-core.lock names, vcpkg-configuration.json
# the swarm-routing/vcpkg-registry baseline, and swarm-routing/.github's
# setup-vcpkg action gives the tool. The check name is `core`.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@f1a18f9889a1f58ba144f406a72c966eaba10507 # main@2026-11-26
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          repository: swarm-routing/.github
          ref: a3155ab8851bab4a54f41b770f22587afee30f2d
          path: .org
          sparse-checkout: |
            .clang-format
            .clang-tidy
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: vcpkg (swarm-routing/.github#489)
        if: steps.changes.outputs.docs-only != 'true'
        id: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@f1a18f9889a1f58ba144f406a72c966eaba10507 # main@2026-11-26
        timeout-minutes: 8
        with:
          # The NuGet cache needs mono on the runner (28-50 s to install); the
          # ports it would restore build in seconds, so here it costs more than
          # it saves (measured on ARA's PR #176, swarm-routing/.github#489).
          binary-cache: 'off'
      # one vcpkg_installed for every configure below: the port is installed once
      - name: Build and test (debug, strict warnings; swarm-core from its vcpkg port)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/debug -j "$(nproc)"
          ctest --test-dir build/debug --output-on-failure
      - name: clang-tidy (org .clang-tidy, findings are errors; core/ sources, tests excluded; swarm-routing/.github#635)
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: |
          git ls-files 'core/*.cc' ':!core/test/**' | xargs clang-tidy-18 -p build/debug --config-file=.org/.clang-tidy --warnings-as-errors='*' --header-filter="^$PWD/core/[^/]+\.h$" --quiet
      - name: Build and test (ASan + UBSan; Q-Swarm instrumented, swarm-core the port as published)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DQSWARM_CORE_SANITIZE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed"
          cmake --build build/sanitized -j "$(nproc)"
          ctest --test-dir build/sanitized --output-on-failure
      - name: The CMake package q-swarm-core (find_package, on the swarm-core port; swarm-routing/.github#436)
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TOOLCHAIN: ${{ steps.vcpkg.outputs.toolchain }}
        run: |
          prefix="$PWD/build/prefix"
          installed="$PWD/build/vcpkg_installed"
          cmake -S core -B build/pkg -DCMAKE_BUILD_TYPE=Release -DQSWARM_CORE_INSTALL=ON -DQSWARM_CORE_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DVCPKG_INSTALLED_DIR="$installed"
          cmake --build build/pkg -j "$(nproc)" && cmake --install build/pkg --prefix "$prefix"
          for f in lib/libq_swarm_core.a lib/cmake/q-swarm-core/q-swarm-coreConfig.cmake lib/cmake/q-swarm-core/q-swarm-coreConfigVersion.cmake lib/cmake/q-swarm-core/q-swarm-coreTargets.cmake; do
            test -f "$prefix/$f" || { echo "::error::the install has no $f"; exit 1; }
          done
          cmake -S core/test/consumer-package -B build/consumer -DCMAKE_PREFIX_PATH="$prefix;$installed/x64-linux"
          cmake --build build/consumer && build/consumer/consumer
      - name: The release asset carries core/ (make dist, what the q-swarm-core port builds)
        if: steps.changes.outputs.docs-only != 'true'
        run: make dist
      - name: Format (org .clang-format)
        if: steps.changes.outputs.docs-only != 'true'
        run: git ls-files 'core/*.h' 'core/*.cc' | xargs clang-format-18 --style=file:.org/.clang-format --dry-run --Werror

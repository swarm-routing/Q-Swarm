# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#765)
bestpractices_project = "17069"
# the CI badge: core/'s workflow (no ns-3 module yet, so no ns3.yml; the default ci.yml does not exist here)
ci_workflow = "core.yml"
# the C++ badge: core/'s standard, the one of the ns-3 release the org supports (swarm-routing/ns3-swarm-core#141)
cxx = "23"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
title = "Q-Swarm"
dual = ["core/"]

[docs]
arena_id = "Q-Swarm"  # its id in swarm-routing.github.io site/hub/projects.json (swarm-routing/swarm-routing.github.io#312)

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "Q-Swarm: Q-routing with energy-aware Bellman updates and Boltzmann next-hop selection, bridging pheromone tables and lightweight on-node reinforcement learning, as a simulator-agnostic C++23 core on swarm-core's ports with thin ns-3 and Linux adapters (planned)."
homepage = "https://swarm-routing.github.io/projects/Q-Swarm/"
topics = ["q-routing", "reinforcement-learning", "swarm-intelligence", "energy-aware-routing", "routing-protocol", "manet", "wireless-sensor-networks", "ns-3"]
ruleset = "protocol"
# Only checks that run on every PR today (core.yml and swarm-core-pin.yml run on
# pull_request and merge_group). Add the ns-3 checks once ns3/ and its workflow exist.
required_checks = ["check / org-sync", "headers / licence", "title / title", "core", "swarm-core / pin", "review / coderabbit"]
# Checks that run on main but gate no merge (swarm-routing/.github#776), as ARA, which
# requires none of them: CodeQL, Scorecard, SonarCloud and CodeRabbit's own check run report
# (review / coderabbit is the gate); doxygen runs on pull_request but not merge_group;
# autofix / pick and notify are bot jobs.
optional_checks = ["Analyze (*)", "analysis / Scorecard analysis", "autofix / pick", "CodeRabbit", "doxygen / doxygen", "notify", "SonarCloud Code Analysis"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
